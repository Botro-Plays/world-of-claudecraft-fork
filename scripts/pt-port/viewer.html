<!DOCTYPE html>
<html>
<head>
<title>PT GLB Viewer</title>
<style>body{margin:0;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(3, 3, 5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);

const grid = new THREE.GridHelper(10, 10, 0x666666, 0x444444);
scene.add(grid);

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

const loader = new GLTFLoader();
const params = new URLSearchParams(window.location.search);
let currentModel = params.get('model') || 'monster/hopy.glb';
// Auto-prefix old-style model names (e.g. "hopy.glb") with "monster/"
if (currentModel && !currentModel.includes('/') && !currentModel.startsWith('converted/')) {
  currentModel = 'monster/' + currentModel;
}
let currentMixer = null;
let currentActions = {};
let currentModelRoot = null;
let skeletonHelper = null;

// --- Model dropdown (top-right) ---
const dropdownPanel = document.createElement('div');
dropdownPanel.style.cssText = 'position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;color:white;font-family:monospace;z-index:100;max-height:90vh;overflow-y:auto';
dropdownPanel.innerHTML = '<b>Model:</b><br>';

// Category dropdown
const catLabel = document.createElement('label');
catLabel.textContent = 'Category:';
catLabel.style.cssText = 'display:block;margin-top:4px;font-size:11px;color:#aaa';
dropdownPanel.appendChild(catLabel);
const categorySelect = document.createElement('select');
categorySelect.style.cssText = 'display:block;margin:2px 0 6px;padding:4px;width:220px;background:#222;color:white;border:1px solid #555;border-radius:3px';
dropdownPanel.appendChild(categorySelect);

const search = document.createElement('input');
search.type = 'text';
search.placeholder = 'Search...';
search.style.cssText = 'display:block;margin:4px 0;padding:4px 8px;width:200px;background:#222;color:white;border:1px solid #555;border-radius:3px';
dropdownPanel.appendChild(search);
const select = document.createElement('select');
select.size = 15;
select.style.cssText = 'display:block;margin:4px 0;padding:4px;width:220px;background:#222;color:white;border:1px solid #555;border-radius:3px';
dropdownPanel.appendChild(select);
document.body.appendChild(dropdownPanel);

let allGlbs = [];
let currentCategory = 'all';

// Category display names
const CATEGORY_LABELS = {
  'all': 'All',
  'monster': 'Monster',
  'npc': 'NPC',
  'item': 'Item',
  'mount': 'Mount',
};

// Extract category (first path segment) from a model path
function categoryOf(path) {
  const seg = path.split('/')[0];
  return CATEGORY_LABELS[seg] ? seg : 'other';
}

// Get sorted list of categories that have models
function availableCategories() {
  const cats = new Set(allGlbs.map(categoryOf));
  return ['all', ...Array.from(cats).sort()];
}

async function loadModelList() {
  const fallback = ['monster/hopy.glb', 'monster/bargon.glb', 'monster/bargon-die.glb'];
  try {
    const resp = await fetch('http://localhost:3001/list-glbs');
    const data = await resp.json();
    allGlbs = (data.glbs && data.glbs.length > 0) ? data.glbs : fallback;
  } catch {
    allGlbs = fallback;
  }
  // Populate category dropdown
  const cats = availableCategories();
  categorySelect.innerHTML = '';
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = CATEGORY_LABELS[cat] || cat;
    categorySelect.appendChild(opt);
  });
  // Set initial category from current model
  currentCategory = categoryOf(currentModel);
  categorySelect.value = currentCategory;
  populateSelect();
  select.value = currentModel;
}

function populateSelect() {
  const q = search.value.toLowerCase();
  let filtered = allGlbs;
  if (currentCategory !== 'all') {
    filtered = filtered.filter(n => categoryOf(n) === currentCategory);
  }
  if (q) {
    filtered = filtered.filter(n => n.toLowerCase().includes(q));
  }
  select.innerHTML = '';
  filtered.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    // Show a shorter label: strip the category prefix for readability
    const label = name.includes('/') ? name.substring(name.indexOf('/') + 1) : name;
    opt.textContent = label;
    select.appendChild(opt);
  });
}

loadModelList();

categorySelect.onchange = () => {
  currentCategory = categorySelect.value;
  populateSelect();
};

search.oninput = () => {
  populateSelect();
};

select.onchange = () => {
  currentModel = select.value;
  params.set('model', currentModel);
  window.history.replaceState({}, '', '?' + params.toString());
  loadModel(modelUrl(currentModel));
};

// Resolve a model name from the API to a loadable URL.
// Organized files (e.g. "monster/hopy.glb") load from converted/.
// Legacy flat files (e.g. "hopy.glb") load from the pt-port root.
function modelUrl(name) {
  if (name.includes('/')) return 'converted/' + name;
  return './' + name;
}

// --- Model loading ---
function loadModel(glbUrl) {
  if (currentModelRoot) { scene.remove(currentModelRoot); currentModelRoot = null; }
  if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
  if (currentMixer) { currentMixer.stopAllAction(); currentMixer = null; }
  const oldPanel = document.getElementById('anim-panel');
  if (oldPanel) oldPanel.remove();

  loader.load(glbUrl, (gltf) => {
    const model = gltf.scene;
    currentModelRoot = model;
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.material.side = THREE.DoubleSide;
        obj.material.alphaTest = 0.5;
        obj.material.transparent = false;
      }
    });
    scene.add(model);

    // Auto-frame camera
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 1.8;
    camera.position.set(center.x + dist * 0.3, center.y + size.y * 0.1, center.z + dist);
    camera.near = maxDim / 100;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
    controls.update();

    // Setup animations
    if (gltf.animations.length > 0) {
      currentMixer = new THREE.AnimationMixer(model);
      currentActions = {};
      gltf.animations.forEach((clip) => {
        currentActions[clip.name] = currentMixer.clipAction(clip);
      });
      const bindMode = params.get('bind') !== '0';
      if (!bindMode) {
        const firstName = gltf.animations[0].name;
        if (currentActions[firstName]) currentActions[firstName].play();
      }
    }

    // Animation panel (top-left)
    const panel = document.createElement('div');
    panel.id = 'anim-panel';
    panel.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;color:white;font-family:monospace;max-height:90vh;overflow-y:auto';
    panel.innerHTML = '<b>Animations:</b><br>';

    // Wireframe toggle
    const wfBtn = document.createElement('button');
    wfBtn.textContent = 'Wireframe: OFF';
    wfBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    let wfOn = false;
    wfBtn.onclick = () => {
      wfOn = !wfOn;
      wfBtn.textContent = 'Wireframe: ' + (wfOn ? 'ON' : 'OFF');
      model.traverse((obj) => { if (obj.isMesh) obj.material.wireframe = wfOn; });
    };
    panel.appendChild(wfBtn);

    // Skeleton view
    const skBtn = document.createElement('button');
    skBtn.textContent = 'Show Skeleton';
    skBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    let skOn = false;
    skBtn.onclick = () => {
      skOn = !skOn;
      skBtn.textContent = skOn ? 'Hide Skeleton' : 'Show Skeleton';
      if (skOn) {
        skeletonHelper = new THREE.SkeletonHelper(model);
        skeletonHelper.material.linewidth = 2;
        scene.add(skeletonHelper);
      } else if (skeletonHelper) {
        scene.remove(skeletonHelper);
        skeletonHelper = null;
      }
    };
    panel.appendChild(skBtn);

    // Bind pose
    const noAnimBtn = document.createElement('button');
    noAnimBtn.textContent = 'Bind Pose';
    noAnimBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    noAnimBtn.onclick = () => {
      Object.values(currentActions).forEach(a => a.stop());
    };
    panel.appendChild(noAnimBtn);

    // One button per animation clip
    gltf.animations.forEach((clip) => {
      const btn = document.createElement('button');
      btn.textContent = clip.name;
      btn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
      btn.onclick = () => {
        Object.values(currentActions).forEach(a => a.stop());
        currentActions[clip.name].play();
      };
      panel.appendChild(btn);
    });
    document.body.appendChild(panel);

    console.log('Loaded:', glbUrl, '| Animations:', gltf.animations.map(a => a.name));
  }, undefined, (error) => {
    console.error('Load error:', error);
  });
}

// Initial load
loadModel(modelUrl(currentModel));

// --- Render loop ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (currentMixer) currentMixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
