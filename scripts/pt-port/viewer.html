<!DOCTYPE html>
<html>
<head>
<title>PT GLB Viewer</title>
<style>body{margin:0;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(3, 3, 5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);

const grid = new THREE.GridHelper(10, 10, 0x666666, 0x444444);
scene.add(grid);

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

const loader = new GLTFLoader();
const params = new URLSearchParams(window.location.search);
let currentModel = params.get('model') || 'hopy.glb';
let currentMixer = null;
let currentActions = {};
let currentModelRoot = null;
let skeletonHelper = null;

// --- Model dropdown (top-right) ---
const dropdownPanel = document.createElement('div');
dropdownPanel.style.cssText = 'position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;color:white;font-family:monospace;z-index:100';
dropdownPanel.innerHTML = '<b>Model:</b><br>';
const select = document.createElement('select');
select.style.cssText = 'display:block;margin:4px 0;padding:4px 8px;width:180px;background:#222;color:white;border:1px solid #555;border-radius:3px';
dropdownPanel.appendChild(select);
document.body.appendChild(dropdownPanel);

async function loadModelList() {
  const fallback = ['hopy.glb', 'bargon.glb', 'bargon-die.glb'];
  try {
    const resp = await fetch('http://localhost:3001/list-glbs');
    const data = await resp.json();
    const glbs = (data.glbs && data.glbs.length > 0) ? data.glbs : fallback;
    glbs.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
  } catch {
    fallback.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
  }
  select.value = currentModel;
}
loadModelList();

select.onchange = () => {
  currentModel = select.value;
  params.set('model', currentModel);
  window.history.replaceState({}, '', '?' + params.toString());
  loadModel('./' + currentModel);
};

// --- Model loading ---
function loadModel(glbUrl) {
  if (currentModelRoot) { scene.remove(currentModelRoot); currentModelRoot = null; }
  if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
  if (currentMixer) { currentMixer.stopAllAction(); currentMixer = null; }
  const oldPanel = document.getElementById('anim-panel');
  if (oldPanel) oldPanel.remove();

  loader.load(glbUrl, (gltf) => {
    const model = gltf.scene;
    currentModelRoot = model;
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.material.side = THREE.DoubleSide;
        obj.material.alphaTest = 0.5;
        obj.material.transparent = false;
      }
    });
    scene.add(model);

    // Auto-frame camera
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 1.8;
    camera.position.set(center.x + dist * 0.3, center.y + size.y * 0.1, center.z + dist);
    camera.near = maxDim / 100;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
    controls.update();

    // Setup animations
    if (gltf.animations.length > 0) {
      currentMixer = new THREE.AnimationMixer(model);
      currentActions = {};
      gltf.animations.forEach((clip) => {
        currentActions[clip.name] = currentMixer.clipAction(clip);
      });
      const bindMode = params.get('bind') !== '0';
      if (!bindMode) {
        const firstName = gltf.animations[0].name;
        if (currentActions[firstName]) currentActions[firstName].play();
      }
    }

    // Animation panel (top-left)
    const panel = document.createElement('div');
    panel.id = 'anim-panel';
    panel.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;color:white;font-family:monospace;max-height:90vh;overflow-y:auto';
    panel.innerHTML = '<b>Animations:</b><br>';

    // Wireframe toggle
    const wfBtn = document.createElement('button');
    wfBtn.textContent = 'Wireframe: OFF';
    wfBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    let wfOn = false;
    wfBtn.onclick = () => {
      wfOn = !wfOn;
      wfBtn.textContent = 'Wireframe: ' + (wfOn ? 'ON' : 'OFF');
      model.traverse((obj) => { if (obj.isMesh) obj.material.wireframe = wfOn; });
    };
    panel.appendChild(wfBtn);

    // Skeleton view
    const skBtn = document.createElement('button');
    skBtn.textContent = 'Show Skeleton';
    skBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    let skOn = false;
    skBtn.onclick = () => {
      skOn = !skOn;
      skBtn.textContent = skOn ? 'Hide Skeleton' : 'Show Skeleton';
      if (skOn) {
        skeletonHelper = new THREE.SkeletonHelper(model);
        skeletonHelper.material.linewidth = 2;
        scene.add(skeletonHelper);
      } else if (skeletonHelper) {
        scene.remove(skeletonHelper);
        skeletonHelper = null;
      }
    };
    panel.appendChild(skBtn);

    // Bind pose
    const noAnimBtn = document.createElement('button');
    noAnimBtn.textContent = 'Bind Pose';
    noAnimBtn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
    noAnimBtn.onclick = () => {
      Object.values(currentActions).forEach(a => a.stop());
    };
    panel.appendChild(noAnimBtn);

    // One button per animation clip
    gltf.animations.forEach((clip) => {
      const btn = document.createElement('button');
      btn.textContent = clip.name;
      btn.style.cssText = 'display:block;margin:2px;padding:4px 12px;cursor:pointer;width:100%';
      btn.onclick = () => {
        Object.values(currentActions).forEach(a => a.stop());
        currentActions[clip.name].play();
      };
      panel.appendChild(btn);
    });
    document.body.appendChild(panel);

    console.log('Loaded:', glbUrl, '| Animations:', gltf.animations.map(a => a.name));
  }, undefined, (error) => {
    console.error('Load error:', error);
  });
}

// Initial load
loadModel('./' + currentModel);

// --- Render loop ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (currentMixer) currentMixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
