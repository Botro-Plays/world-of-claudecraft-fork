<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PT Fighter Viewer</title>
<style>
  body { margin: 0; background: #1a1a2e; color: #eee; font-family: sans-serif; overflow: hidden; }
  #info { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
  #info h2 { margin: 0 0 5px 0; }
  #info p { margin: 2px 0; font-size: 13px; }
  #hair-row { margin-top: 8px; display: flex; gap: 6px; }
  #hair-row button { background: #333; color: #eee; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #hair-row button.sel { background: #4a6; border-color: #6c8; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <h2>PT Fighter Direct Viewer</h2>
  <p>Body: tmbB01.smd + TmbB01.bmp (Fighter armor B)</p>
  <p>Head: hfighter_02.smd + TmhB_dae.bmp (Fighter)</p>
  <div id="hair-row">
    <button data-hair="0" class="sel">Hair 1 (style02)</button>
    <button data-hair="1">Hair 2 (style03)</button>
    <button data-hair="2">Hair 3 (rPTF)</button>
  </div>
  <p id="status">Status: Loading...</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const HAIR_FILES = [
  'models/creatures/pt_fighter.glb',
  'models/creatures/pt_fighter_hair2.glb',
  'models/creatures/pt_fighter_hair3.glb',
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a4e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-2, 2, -3);
scene.add(fillLight);

const grid = new THREE.GridHelper(10, 10, 0x444466, 0x333355);
scene.add(grid);

const loader = new GLTFLoader();
let currentModel = null;
let currentMixer = null;
let currentHair = 0;
const clock = new THREE.Clock();

function loadHair(idx) {
  currentHair = idx;
  document.querySelectorAll('#hair-row button').forEach((b, i) => {
    b.classList.toggle('sel', i === idx);
  });
  document.getElementById('status').textContent = 'Status: Loading ' + HAIR_FILES[idx] + '...';
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (currentMixer) { currentMixer = null; }

  loader.load(HAIR_FILES[idx], (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const scale = 2.6 / size.y;
    model.scale.setScalar(scale);
    model.position.x = -center.x * scale;
    model.position.y = -box.min.y * scale;
    model.position.z = -center.z * scale;
    scene.add(model);
    currentModel = model;

    currentMixer = new THREE.AnimationMixer(model);
    const standClip = gltf.animations.find(a => a.name === 'STAND');
    if (standClip) {
      currentMixer.clipAction(standClip).play();
      document.getElementById('status').textContent = 'Status: Loaded ' + HAIR_FILES[idx] + ', playing STAND';
    } else {
      document.getElementById('status').textContent = 'Status: Loaded ' + HAIR_FILES[idx] + ', no STAND clip';
    }
    console.log('Animations:', gltf.animations.map(a => a.name));
  }, undefined, (err) => {
    document.getElementById('status').textContent = 'Status: Error: ' + err.message;
    console.error('GLB load error:', err);
  });
}

document.querySelectorAll('#hair-row button').forEach((btn) => {
  btn.addEventListener('click', () => loadHair(Number(btn.dataset.hair)));
});

loadHair(0);

function animate() {
  requestAnimationFrame(animate);
  if (currentMixer) currentMixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
